<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokasi · Tempat Sampah UNPAR</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lokasi.css">
</head>
<body>
  <main>
    <h1>Lokasi</h1>
    <div id="map" class="map" role="region" aria-label="Peta tempat sampah"></div>
    <ul class="legend" aria-label="Kunci peta">
      <li><span class="pin pin-NORMAL"><span></span></span> Normal (lingkaran)</li>
      <li><span class="pin pin-PENUH"><span></span></span> Penuh (persegi)</li>
      <li><span class="pin pin-OVERWEIGHT"><span></span></span> Overweight (belah ketupat)</li>
      <li><span class="pin pin-PENUH_OVERWEIGHT"><span></span></span> Penuh + Overweight (segi delapan)</li>
      <li><span class="pin pin-OFFLINE"><span></span></span> Offline (lingkaran putus-putus)</li>
    </ul>
    <h2>Daftar tempat sampah</h2>
    <ul id="list" class="bin-list"></ul>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/mock.js"></script>
  <script src="js/common.js"></script>
  <script src="js/lokasi.js"></script>
</body>
</html>
